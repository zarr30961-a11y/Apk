<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a0f1f">
<title>Drakoo – Drama Pendek</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#1a0f1f;--sf:#2a1a31;--tx:#fbf1ea;--mu:#b9a3b4;--ac:#ffb23e;--hot:#ff5a5f;--ln:#3d2a45;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#fff7f0;--sf:#ffe9d9;--tx:#2a1330;--mu:#7d6580;--ac:#d9750a;--hot:#d93c43;--ln:#f1d2bd}}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font-family:"Bricolage Grotesque",system-ui,sans-serif;overflow:hidden}
#app{max-width:480px;height:100%;margin:0 auto;position:relative;display:flex;flex-direction:column}
main{flex:1;overflow-y:auto;padding:14px 16px 20px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
h1{font-size:26px;font-weight:800;letter-spacing:-.5px}
h2{font-size:17px;font-weight:600;margin:22px 0 10px}
.top{display:flex;justify-content:space-between;align-items:center}
.coin{background:var(--sf);border:1px solid var(--ln);border-radius:20px;padding:6px 12px;font-weight:600;font-size:14px}
.hero{position:relative;margin-top:16px;border-radius:22px;padding:20px;min-height:210px;display:flex;flex-direction:column;justify-content:flex-end;text-align:left;width:100%}
.hero b{font-size:28px;line-height:1.1;font-weight:800;max-width:80%}
.hero span{font-size:14px;opacity:.9;margin-top:6px}
.chips{display:flex;gap:8px;overflow-x:auto;margin-top:16px;padding-bottom:2px}
.chip{flex:none;padding:7px 14px;border-radius:18px;background:var(--sf);border:1px solid var(--ln);font-size:14px}
.chip.on{background:var(--ac);color:#2a1330;border-color:var(--ac);font-weight:600}
.row{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px}
.card{flex:none;width:124px;text-align:left}
.poster{height:176px;border-radius:14px;padding:10px;display:flex;align-items:flex-end;font-weight:800;font-size:15px;line-height:1.1;position:relative;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.45)}
.tag{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.5);border-radius:8px;padding:2px 7px;font-size:11px;font-weight:600;text-shadow:none}
.card small{display:block;margin-top:6px;color:var(--mu);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid .card{width:auto}
nav{display:flex;border-top:1px solid var(--ln);background:var(--bg);padding-bottom:4px}
nav button{flex:1;padding:12px 0;color:var(--mu);font-size:13px;font-weight:600}
nav button.on{color:var(--ac)}
.empty{color:var(--mu);text-align:center;margin-top:60px;line-height:1.5}
.sheet{position:absolute;inset:0;background:var(--bg);z-index:5;overflow-y:auto;padding:0 16px 24px;display:none}
.sheet.show{display:block}
.back{padding:14px 0;font-size:15px;color:var(--mu)}
.dh{display:flex;gap:14px;margin-top:4px}
.dh .poster{width:112px;height:156px;flex:none}
.dh p{color:var(--mu);font-size:14px;line-height:1.45;margin-top:8px}
.btns{display:flex;gap:10px;margin:16px 0}
.btn{flex:1;padding:13px;border-radius:14px;background:var(--ac);color:#2a1330;font-weight:800;text-align:center}
.btn.alt{background:var(--sf);color:var(--tx);border:1px solid var(--ln);font-weight:600}
.eps{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.ep{aspect-ratio:1;border-radius:10px;background:var(--sf);border:1px solid var(--ln);font-weight:600;font-size:14px;position:relative}
.ep.lock{color:var(--mu)}
.ep.lock::after{content:"🔒";position:absolute;top:1px;right:2px;font-size:9px}
.player{position:absolute;inset:0;z-index:9;background:#000;display:none;color:#fff;overflow:hidden}
.player.show{display:block}
.scene{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:30px;transition:background .6s}
.scene .big{font-size:42px;font-weight:800;line-height:1;opacity:.95}
.scene .ln{position:absolute;bottom:128px;left:20px;right:70px;font-size:17px;font-weight:600;text-shadow:0 2px 8px #000;text-align:left;min-height:48px}
.ptop{position:absolute;top:0;left:0;right:0;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 30px;background:linear-gradient(#000a,transparent);z-index:2}
.bar{height:3px;background:#fff4;border-radius:2px;margin-bottom:10px}
.bar i{display:block;height:100%;width:0;background:#fff;border-radius:2px}
.ptop div{display:flex;justify-content:space-between;align-items:center;font-weight:600}
.side{position:absolute;right:10px;bottom:60px;display:flex;flex-direction:column;gap:16px;z-index:2}
.side button{font-size:24px;text-align:center;text-shadow:0 1px 6px #000}
.side small{display:block;font-size:11px}
.pbot{position:absolute;left:0;right:0;bottom:0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,#000c);z-index:2;display:flex;gap:10px;align-items:center}
.pbot b{flex:1;font-size:14px}
.pbot button{padding:10px 16px;border-radius:12px;background:#fff2;font-weight:600}
.pause{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:64px;z-index:1;background:#0004}
.pause.show{display:flex}
.lockp{position:absolute;inset:0;background:#000e;z-index:4;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:30px;text-align:center}
.lockp.show{display:flex}
.lockp .btn{flex:none;min-width:220px}
.toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:14px;font-weight:600;z-index:20;display:none;white-space:nowrap}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000;display:none}
nav button{padding:8px 0 6px;font-size:11px}
nav button span{display:block;font-size:20px;margin-bottom:2px}
.sbox{width:100%;margin-top:14px;padding:13px 16px;border-radius:14px;border:1px solid var(--ln);background:var(--sf);color:var(--tx);font:inherit;font-size:16px}
.sbox:focus-visible{outline:2px solid var(--ac)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:12px 0 16px}
.day{aspect-ratio:1;border-radius:10px;background:var(--sf);border:1px solid var(--ln);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px}
.day.on{background:var(--ac);color:#2a1330;border-color:var(--ac)}
.btn[disabled]{opacity:.5;cursor:default}
.mis{display:flex;justify-content:space-between;align-items:center;background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:10px;font-size:15px}
.mis small{color:var(--mu);display:block;margin-top:2px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.stat{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:14px}
.stat b{display:block;font-size:26px;font-weight:800}
.stat span{color:var(--mu);font-size:13px}
.car{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:22px;margin-top:16px}
.car::-webkit-scrollbar{display:none}
.car .hero{flex:none;width:100%;scroll-snap-align:start;margin-top:0;min-height:300px}
.rk{position:absolute;top:12px;left:12px;background:var(--hot);color:#fff;padding:3px 10px;border-radius:8px;font-size:12px;font-weight:600;margin:0!important;opacity:1!important}
.dots{display:flex;justify-content:center;gap:6px;margin-top:10px}
.dots i{width:6px;height:6px;border-radius:3px;background:var(--ln);transition:width .25s,background .25s}
.dots i.on{width:18px;background:var(--ac)}
.player{touch-action:none}
@keyframes inUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes inDn{from{transform:translateY(-100%)}to{transform:none}}
.player.up #vid,.player.up #scene{animation:inUp .3s ease-out}
.player.dn #vid,.player.dn #scene{animation:inDn .3s ease-out}
main{overflow-x:hidden}
#app{overflow:hidden}
.scene .ln{display:none}
.ptop,.side{transition:opacity .3s}
.player.hide .ptop,.player.hide .side{opacity:0;pointer-events:none}
.player{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.spd{position:absolute;top:84px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.6);color:#fff;padding:6px 14px;border-radius:16px;font-weight:600;font-size:14px;z-index:3;display:none}
.spd.show{display:block}
.hrt{position:absolute;font-size:48px;line-height:1;z-index:3;pointer-events:none;animation:hrt .9s ease-out forwards}
@keyframes hrt{from{transform:scale(.4) rotate(var(--rot));opacity:1}to{transform:translateY(-70px) scale(1.4) rotate(var(--rot));opacity:0}}
@media (prefers-color-scheme:light){:root[data-theme="light"]{--bg:#fff7f0}}
:root[data-theme="light"]{--bg:#fff7f0;--sf:#ffe9d9;--tx:#2a1330;--mu:#7d6580;--ac:#d9750a;--hot:#d93c43;--ln:#f1d2bd}
.pb{position:absolute;left:10px;right:10px;bottom:5px;height:3px;background:rgba(255,255,255,.3);border-radius:2px;overflow:hidden}
.pb b{display:block;height:100%;background:var(--ac)}
.rm{display:block;margin-top:6px;padding:7px 0;width:100%;border-radius:10px;border:1px solid var(--ln);background:var(--sf);font-size:12px;font-weight:600;text-align:center}
.rm.on{background:var(--ac);color:#2a1330;border-color:var(--ac)}
.rkr{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:9px 0;border-bottom:1px solid var(--ln)}
.rn{width:26px;font-size:20px;font-weight:800;text-align:center;color:var(--mu)}
.rn.t3{color:var(--ac)}
.poster.mini{width:52px;height:72px;flex:none;border-radius:10px;padding:0}
.ri{flex:1;min-width:0}
.ri b{display:block;font-size:15px;font-weight:600}
.ri small{color:var(--mu);font-size:12px}
.tr{font-size:12px;font-weight:600;color:var(--mu);width:36px;text-align:right}
.tr.up{color:#2fbf71}
.tr.dn{color:var(--hot)}
.side{gap:10px!important}
.side button{font-size:22px!important}
.player.cc .scene .ln{display:block;bottom:90px}
.epl{position:absolute;left:0;right:0;bottom:0;max-height:55%;background:#1a0f1f;color:#fbf1ea;border-radius:20px 20px 0 0;z-index:6;padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px));overflow-y:auto;display:none;touch-action:pan-y;overscroll-behavior:contain}
.epl.show{display:block}
.eph{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-weight:600}
.epl .ep{background:#2a1a31;border-color:#3d2a45;color:#fbf1ea}
.epl .ep.cur{background:#ffb23e;color:#2a1330;border-color:#ffb23e}
nav button svg.ni{display:block;width:24px;height:24px;margin:0 auto 3px}
.ni .o{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.ni .s{display:none;fill:currentColor;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round}
nav button.on .ni .o{display:none}
nav button.on .ni .s{display:inline}
.side{gap:20px!important;bottom:70px!important}
.side button svg{width:38px;height:38px;fill:#fff;display:block;margin:0 auto;filter:drop-shadow(0 1px 4px rgba(0,0,0,.5))}
.side small{font-size:13px!important;font-weight:600;margin-top:3px;text-shadow:0 1px 4px rgba(0,0,0,.7)}
#like.on svg{fill:#ff3b5c}
#save.on svg{fill:#ffb23e}
#intro{position:fixed;inset:0;background:#000;z-index:100;display:flex;align-items:center;justify-content:center;transition:opacity .6s}
#intro.out{opacity:0;pointer-events:none}
#intro .lg{display:flex;flex-direction:column;align-items:center;gap:18px;opacity:0;animation:ilogo 2s ease-out .3s forwards}
#intro b{color:#fbf1ea;font-size:28px;font-weight:800;letter-spacing:.5px;font-family:"Bricolage Grotesque",system-ui,sans-serif}
@keyframes ilogo{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#intro .lg{animation-duration:.6s}}
.ni .o.f{fill:currentColor;stroke:none}
.ni .s.k{fill:var(--bg);stroke:none}
.ni .s.r{fill:none;stroke:var(--bg);stroke-width:1.6}
.ni .s.m{fill:none;stroke-width:2.8;stroke-linecap:round}
.sbar{position:relative;margin-top:14px}
.sbar svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:22px;height:22px;fill:none;stroke:var(--mu);stroke-width:2;stroke-linecap:round;pointer-events:none}
.sbar .sbox{margin-top:0;padding-left:46px;border-radius:26px}
.ph{display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;align-items:center;gap:8px}
.brand b{font-size:24px;font-weight:800;letter-spacing:-.5px}
.ib{padding:6px;margin-left:8px;color:var(--tx)}
.ib svg{width:26px;height:26px;display:block}
.pr{display:flex;gap:16px;align-items:center;margin-top:18px}
.av{position:relative;width:92px;height:92px;border-radius:50%;background:linear-gradient(160deg,#ff7a59,#5b1a4a) center/cover;display:flex;align-items:center;justify-content:center;flex:none}
.av>svg{width:48px;height:48px;color:#fff;opacity:.9}
.cam{position:absolute;right:-2px;bottom:-2px;width:32px;height:32px;border-radius:50%;background:var(--sf);color:var(--tx);border:2px solid var(--bg);display:flex;align-items:center;justify-content:center}
.cam svg{width:16px;height:16px}
.pi{flex:1;display:flex;align-items:center;text-align:left;gap:8px;min-width:0}
.pi>div{flex:1;min-width:0}
.pi b{display:block;font-size:22px;font-weight:800;overflow-wrap:anywhere}
.pi span{color:var(--mu);font-size:15px}
.pi p{color:var(--mu);font-size:14px;line-height:1.4;margin-top:6px;overflow-wrap:anywhere}
.ch{width:20px;height:20px;color:var(--mu);flex:none}
.st{display:flex;margin-top:20px}
.st div{flex:1;text-align:center;border-left:1px solid var(--ln)}
.st div:first-child{border:0}
.st b{display:block;font-size:18px;font-weight:800}
.st span{color:var(--mu);font-size:12px}
.mc{background:var(--sf);border-radius:18px;margin-top:18px;overflow:hidden}
.mr{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 16px;position:relative}
.mr+.mr::before{content:"";position:absolute;top:0;left:58px;right:16px;border-top:1px solid var(--ln)}
.mi{color:var(--hot);flex:none}
.mi svg{width:28px;height:28px;display:block}
.mr>div{flex:1}
.mr b{display:block;font-size:16px;font-weight:600}
.mr small{color:var(--mu);font-size:13px}
.lb{display:block;margin-top:16px;font-size:13px;color:var(--mu)}
.fld{margin-top:6px}
textarea.sbox{resize:none}
details{background:var(--sf);border-radius:14px;padding:14px;margin-top:10px}
summary{font-weight:600;cursor:pointer}
details p{color:var(--mu);margin-top:8px;font-size:14px;line-height:1.5}
</style>
</head>
<body>
<div id="intro" aria-hidden="true"><div class="lg"><svg viewBox="0 0 100 100" width="120" height="120"><rect width="100" height="100" rx="25" fill="#ffb23e"/><polygon points="38,28 38,72 74,50" fill="#1a0f1f"/></svg><b>Drakoo</b></div></div>
<div id="app">
  <main id="main"></main>
  <nav>
    <button data-t="home" class="on"><svg class="ni" viewBox="0 0 24 24"><path class="o" d="M12 3 3.5 9.5v10.7h5.6v-6h5.8v6h5.6V9.5z"/><path class="s" d="M12 3 3.5 9.5v10.7h5.6v-6h5.8v6h5.6V9.5z"/></svg>Beranda</button>
    <button data-t="search"><svg class="ni" viewBox="0 0 24 24"><circle class="o m" cx="10.5" cy="10.5" r="6.5"/><path class="o m" d="M15.5 15.5 21 21"/><circle class="s m" cx="10.5" cy="10.5" r="6.5"/><path class="s m" d="M15.5 15.5 21 21"/></svg>Search</button>
    <button data-t="reward"><svg class="ni" viewBox="0 0 24 24"><rect class="o" x="3.5" y="8" width="17" height="4" rx="1"/><path class="o" d="M5 12v7.5a1.5 1.5 0 0 0 1.5 1.5h11a1.5 1.5 0 0 0 1.5-1.5V12"/><path class="o" d="M12 8v13"/><path class="o" d="M12 8c-1.2-3-4.8-3.6-4.8-1.3C7.2 8 9.6 8 12 8zm0 0c1.2-3 4.8-3.6 4.8-1.3C16.8 8 14.4 8 12 8z"/><rect class="s" x="3.5" y="8" width="17" height="4" rx="1"/><path class="s" d="M5 12v7.5a1.5 1.5 0 0 0 1.5 1.5h11a1.5 1.5 0 0 0 1.5-1.5V12"/><path class="s r" d="M12 8v13"/><path class="s" d="M12 8c-1.2-3-4.8-3.6-4.8-1.3C7.2 8 9.6 8 12 8zm0 0c1.2-3 4.8-3.6 4.8-1.3C16.8 8 14.4 8 12 8z"/></svg>Hadiah</button>
    <button data-t="list"><svg class="ni" viewBox="0 0 24 24"><path class="o" d="M6.5 3h11A1.5 1.5 0 0 1 19 4.5V21l-7-4.2L5 21V4.5A1.5 1.5 0 0 1 6.5 3z"/><path class="o f" d="M12 6.4l1.15 2.35 2.6.35-1.9 1.8.5 2.55L12 12.2l-2.35 1.25.5-2.55-1.9-1.8 2.6-.35z"/><path class="s" d="M6.5 3h11A1.5 1.5 0 0 1 19 4.5V21l-7-4.2L5 21V4.5A1.5 1.5 0 0 1 6.5 3z"/><path class="s k" d="M12 6.4l1.15 2.35 2.6.35-1.9 1.8.5 2.55L12 12.2l-2.35 1.25.5-2.55-1.9-1.8 2.6-.35z"/></svg>Daftar Saya</button>
    <button data-t="my"><svg class="ni" viewBox="0 0 24 24"><circle class="o" cx="12" cy="8" r="4"/><path class="o" d="M4.5 20.5c0-3.7 3.4-6 7.5-6s7.5 2.3 7.5 6z"/><circle class="s" cx="12" cy="8" r="4"/><path class="s" d="M4.5 20.5c0-3.7 3.4-6 7.5-6s7.5 2.3 7.5 6z"/></svg>Profil</button>
  </nav>
  <section class="sheet" id="detail"></section>
  <section class="sheet" id="sub"></section>
  <input type="file" id="avin" accept="image/*" hidden>
  <section class="player" id="player">
    <div class="scene" id="scene"><div class="big" id="big"></div><div class="ln" id="ln"></div></div>
    <video id="vid" playsinline></video><input type="file" id="pick" accept="video/*" hidden>
    <div class="pause" id="pause">⏸</div>
    <div class="spd" id="spd">⏩ 2x</div>
    <div class="ptop"><div class="bar"><i id="fill"></i></div><div><button id="close" aria-label="Tutup">✕ Tutup</button><span id="pt"></span></div></div>
    <div class="side">
      <button id="like" aria-label="Suka"><svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg><small id="lc">0</small></button>
      <button id="save" aria-label="Favorit"><svg viewBox="0 0 24 24"><path d="M17 3H7c-1.1 0-1.99.9-1.99 2L5 21l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg><small id="sc">0</small></button>
      <button id="shb" aria-label="Bagikan"><svg viewBox="0 0 24 24" style="transform:scaleX(-1)"><path d="M10 9V5l-7 7 7 7v-4.1c5 0 8.5 1.6 11 5.1-1-5-4-10-11-11z"/></svg><small id="shc">0</small></button>
    </div>
    <div class="epl" id="epl"><div class="eph"><b id="eplt"></b><button id="epx" aria-label="Tutup daftar episode">✕</button></div><div class="eps" id="epg"></div></div>
    
      </section>
  <div class="toast" id="toast"></div>
</div>
<script>
/* VIDEO: isi v:"https://situsmu.com/drama1/{n}.mp4" (tanda {n} diganti nomor episode). Kosong = tampilan simulasi.

function heart(x,y){var p=$("player"),r=p.getBoundingClientRect(),h=document.createElement("div");h.className="hrt";h.textContent="❤️";h.style.left=(x-r.left-24)+"px";h.style.top=(y-r.top-24)+"px";h.style.setProperty("--rot",(Math.random()*40-20)+"deg");p.appendChild(h);setTimeout(function(){h.remove()},900)}
function tapAct(x,y){var n=Date.now(),p=$("player");
 if(n-(GS.last||0)<300)GS.cnt=(GS.cnt||1)+1;else GS.cnt=1;
 GS.last=n;clearTimeout(GS.tt);
 if(GS.cnt>=2){heart(x,y);var k=P.d.id+"-"+P.n;if(!S.likes[k]){S.likes[k]=true;sv();side()}return}
 if(p.classList.contains("hide")){showUI();return}
 GS.tt=setTimeout(toggle,260)}
var TX=0,TY=0,GS={};
function fast(on){P.rate=on?2:baseRate();$("vid").playbackRate=P.rate;$("spd").classList.toggle("show",on);GS.fast=on}
$("player").addEventListener("touchstart",function(e){
 if(e.target.closest("button,.epl")){GS.btn=true;return}
 GS.btn=false;GS.moved=false;TX=e.touches[0].clientX;TY=e.touches[0].clientY;clearTimeout(GS.lp);
 GS.lp=setTimeout(function(){if(!GS.moved&&!P.pause)fast(true)},450)},{passive:true});
$("player").addEventListener("touchmove",function(e){if(GS.btn||GS.moved)return;var t=e.touches[0];if(Math.abs(t.clientX-TX)>12||Math.abs(t.clientY-TY)>12){GS.moved=true;clearTimeout(GS.lp)}},{passive:true});
$("player").addEventListener("touchend",function(e){
 if(GS.btn){GS.btn=false;return}
 clearTimeout(GS.lp);
 if(GS.fast){fast(false);return}
 var t=e.changedTouches[0],dx=t.clientX-TX,dy=t.clientY-TY;
 if(Math.abs(dy)>60&&Math.abs(dy)>Math.abs(dx)*1.5){stepEp(dy<0?1:-1);return}
 if(GS.moved)return;
 tapAct(t.clientX,t.clientY)},{passive:true});
$("player").addEventListener("touchcancel",function(){clearTimeout(GS.lp);if(GS.fast)fast(false)},{passive:true});
$("player").addEventListener("contextmenu",function(e){e.preventDefault()});
$("pick").addEventListener("change",function(){var f=this.files[0];if(!f)return;LOCAL[P.d.id+"-"+P.n]=URL.createObjectURL(f);this.value="";P.nt=true;play(P.d.id,P.n)});
document.addEventListener("input",function(e){if(e.target.id=="q"){S.q=e.target.value;$("res").innerHTML=resHtml()}});
document.addEventListener("click",function(e){
 var t=e.target.closest("button,.pause,.scene,video");if(!t)return;
 if(t.tagName=="BUTTON"&&$("player").classList.contains("show"))showUI();
 if(t.dataset.t){S.tab=t.dataset.t;S.q="";document.querySelectorAll("nav button").forEach(function(b){b.classList.toggle("on",b==t)});render();return}
 if(t.dataset.g){S.g=t.dataset.g;render();return}
 if(t.dataset.p){var a=t.dataset.p.split("-");play(+a[0],+a[1]);return}
 if(t.dataset.r){resume(+t.dataset.r);return}
 if(t.dataset.q){var q=+t.dataset.q,dr=q>P.n?1:-1;$("epl").classList.remove("show");play(P.d.id,q);anim(dr);return}
 if(t.dataset.rg){S.rg=t.dataset.rg;$("res").innerHTML=resHtml();return}
 if(t.dataset.th){S.theme=t.dataset.th;applyTheme();sv();document.querySelectorAll("[data-th]").forEach(function(b){b.classList.toggle("on",b.dataset.th==S.theme)});return}
 if(t.dataset.m){var mm=t.dataset.m;if(mm=="edit")openEdit();else if(mm=="watch")openWatch();else if(mm=="fav")goTab("list");else if(mm=="hist")openHist();else if(mm=="prem")tt("Segera hadir");else openHelp();return}
 if(t.dataset.go){goTab(t.dataset.go);return}
 if(t.id=="setb"){openSettings();return}
 if(t.id=="edtb"){openEdit();return}
 if(t.id=="camb"||t.id=="avb"){$("avin").click();return}
 if(t.id=="fsave"){var nm=$("fn").value.trim(),us=$("fu").value.toLowerCase().replace(/[^a-z0-9._]/g,""),bi=$("fb").value.trim();S.pf=Object.assign(pfi(),{name:nm||"Penonton Drakoo",user:us||"penonton",bio:bi});sv();$("sub").classList.remove("show");render();tt("Profil disimpan");return}
 if(t.id=="bk2"){$("sub").classList.remove("show");render();return}
 if(t.dataset.sh){share(D[+t.dataset.sh]);return}
 if(t.dataset.rm){var cz=CS.filter(function(z){return z.id==+t.dataset.rm})[0];S.rem[cz.id]=!S.rem[cz.id];sv();remind(cz,S.rem[cz.id]);t.classList.toggle("on",!!S.rem[cz.id]);t.textContent=S.rem[cz.id]?"✓ Diingatkan":"🔔 Ingatkan saya";tt(S.rem[cz.id]?"Pengingat tayang "+dlab(cz.at)+" disimpan":"Pengingat dibatalkan");return}
 if(t.dataset.s){var i=+t.dataset.s,x=S.list.indexOf(i);if(x>-1)S.list.splice(x,1);else S.list.push(i);sv();openDetail(i);tt(x>-1?"Dihapus dari Daftar Saya":"Disimpan ke Daftar Saya");return}
 if(t.dataset.d){$("sub").classList.remove("show");openDetail(+t.dataset.d);return}
 if(t.id=="bk"){$("detail").classList.remove("show");render();return}
 if(t.id=="ci"){var td=today();if(S.last==td)return;S.streak=(S.last==yest()?(S.streak||0):0)+1;S.last=td;if(S.streak%7==0){S.sev=(S.sev||0)+1;tt("Streak 7 hari! Lencana didapat 🏆")}else tt("Absen berhasil. Streak "+S.streak+" hari");sv();render();return}
 if(t.id=="rst"){if(!t.dataset.a){t.dataset.a=1;t.textContent="Ketuk lagi untuk menghapus";return}try{localStorage.removeItem("drakoo")}catch(e){}S.list=[];S.likes={};S.hist=[];S.prog={};S.rem={};S.spd=1;S.cc=false;S.theme="auto";applyTheme();S.eps=0;S.streak=0;S.last="";S.sev=0;S.today=0;S.pf={};sv();$("sub").classList.remove("show");render();tt("Data dihapus");return}
 if(t.id=="close"){saveProg();clearInterval(P.h);$("epl").classList.remove("show");$("vid").pause();P.v=false;$("player").classList.remove("show");render();return}
 if(t.id=="like"){var k=P.d.id+"-"+P.n;S.likes[k]=!S.likes[k];sv();side();return}
 if(t.id=="save"){var id=P.d.id,y=S.list.indexOf(id);if(y>-1)S.list.splice(y,1);else S.list.push(id);sv();side();tt(y>-1?"Dihapus dari Daftar Saya":"Disimpan ke Daftar Saya");return}
 if(t.id=="epb"){openEpl();return}
 if(t.id=="epx"){$("epl").classList.remove("show");return}
 if(t.id=="spb"){var SP=[0.75,1,1.25,1.5,2];S.spd=SP[(SP.indexOf(baseRate())+1)%SP.length];P.rate=S.spd;$("vid").playbackRate=P.rate;sv();side();tt("Kecepatan "+S.spd+"x");return}
 if(t.id=="ccb"){S.cc=!S.cc;sv();$("player").classList.toggle("cc",S.cc);setTrack();side();if(S.cc&&P.v&&!P.d.sub)tt("Subtitle belum tersedia untuk video ini");else tt(S.cc?"Subtitle aktif":"Subtitle mati");return}
 if(t.id=="shb"){share(P.d);return}
 if(t.id=="vf"){$("pick").click();return}
 
});
$("avin").addEventListener("change",function(){var f=this.files[0];this.value="";if(!f)return;var fr=new FileReader();fr.onload=function(){var im=new Image();im.onload=function(){var c=document.createElement("canvas");c.width=c.height=256;var x=c.getContext("2d"),m=Math.min(im.width,im.height);x.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,256,256);S.pf=Object.assign(pfi(),{img:c.toDataURL("image/jpeg",.82)});sv();var ap=$("avp");if(ap){ap.style.backgroundImage="url("+S.pf.img+")";ap.innerHTML=""}if(S.tab=="my")render();tt("Foto profil diganti")};im.onerror=function(){tt("Foto tidak bisa dibuka")};im.src=fr.result};fr.readAsDataURL(f)});
applyTheme();render();
