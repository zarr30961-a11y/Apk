<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a0f1f">
<title>Drakoo – Drama Pendek</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#1a0f1f;--sf:#2a1a31;--tx:#fbf1ea;--mu:#b9a3b4;--ac:#ffb23e;--hot:#ff5a5f;--ln:#3d2a45;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#fff7f0;--sf:#ffe9d9;--tx:#2a1330;--mu:#7d6580;--ac:#d9750a;--hot:#d93c43;--ln:#f1d2bd}}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font-family:"Bricolage Grotesque",system-ui,sans-serif;overflow:hidden}
#app{max-width:480px;height:100%;margin:0 auto;position:relative;display:flex;flex-direction:column}
main{flex:1;overflow-y:auto;padding:14px 16px 20px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
h1{font-size:26px;font-weight:800;letter-spacing:-.5px}
h2{font-size:17px;font-weight:600;margin:22px 0 10px}
.top{display:flex;justify-content:space-between;align-items:center}
.coin{background:var(--sf);border:1px solid var(--ln);border-radius:20px;padding:6px 12px;font-weight:600;font-size:14px}
.hero{margin-top:16px;border-radius:22px;padding:20px;min-height:210px;display:flex;flex-direction:column;justify-content:flex-end;text-align:left;width:100%}
.hero b{font-size:28px;line-height:1.1;font-weight:800;max-width:80%}
.hero span{font-size:14px;opacity:.9;margin-top:6px}
.chips{display:flex;gap:8px;overflow-x:auto;margin-top:16px;padding-bottom:2px}
.chip{flex:none;padding:7px 14px;border-radius:18px;background:var(--sf);border:1px solid var(--ln);font-size:14px}
.chip.on{background:var(--ac);color:#2a1330;border-color:var(--ac);font-weight:600}
.row{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px}
.card{flex:none;width:124px;text-align:left}
.poster{height:176px;border-radius:14px;padding:10px;display:flex;align-items:flex-end;font-weight:800;font-size:15px;line-height:1.1;position:relative;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.45)}
.tag{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.5);border-radius:8px;padding:2px 7px;font-size:11px;font-weight:600;text-shadow:none}
.card small{display:block;margin-top:6px;color:var(--mu);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid .card{width:auto}
nav{display:flex;border-top:1px solid var(--ln);background:var(--bg);padding-bottom:4px}
nav button{flex:1;padding:12px 0;color:var(--mu);font-size:13px;font-weight:600}
nav button.on{color:var(--ac)}
.empty{color:var(--mu);text-align:center;margin-top:60px;line-height:1.5}
.sheet{position:absolute;inset:0;background:var(--bg);z-index:5;overflow-y:auto;padding:0 16px 24px;display:none}
.sheet.show{display:block}
.back{padding:14px 0;font-size:15px;color:var(--mu)}
.dh{display:flex;gap:14px;margin-top:4px}
.dh .poster{width:112px;height:156px;flex:none}
.dh p{color:var(--mu);font-size:14px;line-height:1.45;margin-top:8px}
.btns{display:flex;gap:10px;margin:16px 0}
.btn{flex:1;padding:13px;border-radius:14px;background:var(--ac);color:#2a1330;font-weight:800;text-align:center}
.btn.alt{background:var(--sf);color:var(--tx);border:1px solid var(--ln);font-weight:600}
.eps{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.ep{aspect-ratio:1;border-radius:10px;background:var(--sf);border:1px solid var(--ln);font-weight:600;font-size:14px;position:relative}
.ep.lock{color:var(--mu)}
.ep.lock::after{content:"🔒";position:absolute;top:1px;right:2px;font-size:9px}
.player{position:absolute;inset:0;z-index:9;background:#000;display:none;color:#fff;overflow:hidden}
.player.show{display:block}
.scene{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:30px;transition:background .6s}
.scene .big{font-size:42px;font-weight:800;line-height:1;opacity:.95}
.scene .ln{position:absolute;bottom:128px;left:20px;right:70px;font-size:17px;font-weight:600;text-shadow:0 2px 8px #000;text-align:left;min-height:48px}
.ptop{position:absolute;top:0;left:0;right:0;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 30px;background:linear-gradient(#000a,transparent);z-index:2}
.bar{height:3px;background:#fff4;border-radius:2px;margin-bottom:10px}
.bar i{display:block;height:100%;width:0;background:#fff;border-radius:2px}
.ptop div{display:flex;justify-content:space-between;align-items:center;font-weight:600}
.side{position:absolute;right:10px;bottom:120px;display:flex;flex-direction:column;gap:16px;z-index:2}
.side button{font-size:24px;text-align:center;text-shadow:0 1px 6px #000}
.side small{display:block;font-size:11px}
.pbot{position:absolute;left:0;right:0;bottom:0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,#000c);z-index:2;display:flex;gap:10px;align-items:center}
.pbot b{flex:1;font-size:14px}
.pbot button{padding:10px 16px;border-radius:12px;background:#fff2;font-weight:600}
.pause{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:64px;z-index:1;background:#0004}
.pause.show{display:flex}
.lockp{position:absolute;inset:0;background:#000e;z-index:4;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:30px;text-align:center}
.lockp.show{display:flex}
.lockp .btn{flex:none;min-width:220px}
.toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:14px;font-weight:600;z-index:20;display:none;white-space:nowrap}
</style>
</head>
<body>
<div id="app">
  <main id="main"></main>
  <nav>
    <button data-t="home" class="on">Beranda</button>
    <button data-t="feed">Jelajah</button>
    <button data-t="list">Daftarku</button>
  </nav>
  <section class="sheet" id="detail"></section>
  <section class="player" id="player">
    <div class="scene" id="scene"><div class="big" id="big"></div><div class="ln" id="ln"></div></div>
    <div class="pause" id="pause">⏸</div>
    <div class="ptop"><div class="bar"><i id="fill"></i></div><div><button id="close" aria-label="Tutup">✕ Tutup</button><span id="pt"></span></div></div>
    <div class="side">
      <button id="like" aria-label="Suka">🤍<small id="lc">0</small></button>
      <button id="save" aria-label="Simpan">🔖<small>Simpan</small></button>
    </div>
    <div class="pbot"><button id="prev">‹ Sebelumnya</button><b id="pe" style="text-align:center"></b><button id="next">Berikutnya ›</button></div>
    <div class="lockp" id="lockp"><div style="font-size:44px">🔒</div><b id="lt" style="font-size:20px"></b><span style="color:#ccc">Buka episode ini dengan 10 koin.</span><button class="btn" id="unlock">Buka dengan 10 koin</button><button class="btn alt" id="claim">Klaim 20 koin harian</button></div>
  </section>
  <div class="toast" id="toast"></div>
</div>
<script>
var D=[
{id:0,t:"Istri Kedua CEO",g:"Romansa",e:60,c:["#ff7a59","#5b1a4a"],s:"Dinikahi demi menutup rahasia keluarga, Laras mulai mencari tahu siapa yang sebenarnya ia nikahi.",l:["Kamu pikir aku akan diam saja?","Pernikahan ini hanya di atas kertas.","Siapa yang kirim pesan itu?"]},
{id:1,t:"Pewaris yang Menyamar",g:"Balas Dendam",e:72,c:["#3b82f6","#0f1a3a"],s:"Ia pulang sebagai tukang ojek, padahal pemilik perusahaan yang dulu mengusirnya.",l:["Mereka belum tahu siapa aku.","Tiga tahun lalu kalian menutup pintu.","Sekarang giliranku."]},
{id:2,t:"Kontrak Pacar Sewaan",g:"Komedi",e:48,c:["#f472b6","#7c1d4f"],s:"Disewa untuk berpura-pura jadi pacar selama sebulan, lalu pura-puranya mulai terasa nyata.",l:["Aturan nomor satu: jangan baper.","Kenapa kamu menatapku begitu?","Ini cuma akting, kan?"]},
{id:3,t:"Mertua Bukan Sembarang",g:"Keluarga",e:55,c:["#34d399","#0b3b2e"],s:"Menantu miskin dihina setiap hari, sampai mertuanya membuka identitas aslinya di depan semua orang.",l:["Duduk di sana, jangan menyentuh apa pun.","Ibu, tolong percaya padaku.","Kalian semua salah menilai dia."]},
{id:4,t:"Malam di Rumah Kosong",g:"Misteri",e:40,c:["#a78bfa","#1b1038"],s:"Seorang penulis menginap di rumah tua dan menemukan catatan harian yang ditulis dengan tulisannya sendiri.",l:["Tulisan ini… milikku?","Ada yang berjalan di lantai atas.","Jangan buka pintu itu."]},
{id:5,t:"Dokter Cinta Pertama",g:"Romansa",e:64,c:["#fbbf24","#7a2e0e"],s:"Dua belas tahun setelah perpisahan, mereka bertemu lagi di ruang gawat darurat yang sama.",l:["Kamu masih pakai parfum itu.","Pasien ini butuh operasi sekarang.","Aku tidak pernah berhenti menunggu."]}
];
var G=["Semua","Romansa","Balas Dendam","Komedi","Keluarga","Misteri"];
var S={tab:"home",g:"Semua",coins:30,ul:{},list:[],likes:{}};
try{var r=localStorage.getItem("drakoo");if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
function sv(){try{localStorage.setItem("drakoo",JSON.stringify(S))}catch(e){}}
var $=function(i){return document.getElementById(i)};
function tt(s){var t=$("toast");t.textContent=s;t.style.display="block";clearTimeout(tt.h);tt.h=setTimeout(function(){t.style.display="none"},1800)}
function bg(d){return "linear-gradient(160deg,"+d.c[0]+","+d.c[1]+")"}
function card(d){return '<button class="card" data-d="'+d.id+'"><div class="poster" style="background:'+bg(d)+'"><span class="tag">'+d.g+'</span>'+d.t+'</div><small>'+d.e+' episode</small></button>'}
function render(){
 var m=$("main"),h="";
 if(S.tab=="home"){
  var f=D[S.id0||0];
  var L=D.filter(function(d){return S.g=="Semua"||d.g==S.g});
  h='<div class="top"><h1>Drakoo</h1><button class="coin" id="coinb">🪙 '+S.coins+'</button></div>'+
  '<button class="hero" data-d="'+f.id+'" style="background:'+bg(f)+'"><b>'+f.t+'</b><span>'+f.g+' · '+f.e+' episode · 5 pertama gratis</span></button>'+
  '<div class="chips">'+G.map(function(g){return '<button class="chip'+(g==S.g?' on':'')+'" data-g="'+g+'">'+g+'</button>'}).join("")+'</div>'+
  '<h2>Sedang ramai</h2><div class="row">'+L.map(card).join("")+'</div>'+
  '<h2>Baru tayang</h2><div class="row">'+L.slice().reverse().map(card).join("")+'</div>'+
  (L.length?'':'<p class="empty">Belum ada drama untuk genre ini.</p>');
 }else if(S.tab=="feed"){
  h='<h1>Jelajah</h1><h2>Semua drama</h2><div class="grid">'+D.map(card).join("")+'</div>';
 }else{
  var L2=D.filter(function(d){return S.list.indexOf(d.id)>-1});
  h='<h1>Daftarku</h1>'+(L2.length?'<h2>Tersimpan</h2><div class="grid">'+L2.map(card).join("")+'</div>':'<p class="empty">Daftarmu masih kosong.<br>Simpan drama dari halaman detail atau saat menonton.</p>');
 }
 m.innerHTML=h;
}
function isOpen(d,n){return n<=5||S.ul[d.id+"-"+n]}
function openDetail(id){
 var d=D[id],h='<button class="back" id="bk">‹ Kembali</button><div class="dh"><div class="poster" style="background:'+bg(d)+'">'+d.t+'</div><div><h1 style="font-size:22px">'+d.t+'</h1><p>'+d.g+' · '+d.e+' episode</p><p>'+d.s+'</p></div></div>'+
 '<div class="btns"><button class="btn" data-p="'+id+'-1">▶ Tonton EP 1</button><button class="btn alt" data-s="'+id+'">'+(S.list.indexOf(id)>-1?'✓ Tersimpan':'+ Simpan')+'</button></div><h2>Episode</h2><div class="eps">';
 for(var i=1;i<=d.e;i++)h+='<button class="ep'+(isOpen(d,i)?'':' lock')+'" data-p="'+id+'-'+i+'">'+i+'</button>';
 $("detail").innerHTML=h+'</div>';$("detail").classList.add("show");$("detail").scrollTop=0;
}
var P={d:null,n:1,p:0,pause:false,li:0,h:null};
function play(id,n){
 P.d=D[id];P.n=n;P.p=0;P.pause=false;P.li=0;
 $("player").classList.add("show");$("pause").classList.remove("show");
 $("scene").style.background=bg(P.d);$("big").innerHTML=P.d.t;
 $("pt").textContent=P.d.t;$("pe").textContent="Episode "+n+" / "+P.d.e;
 var k=P.d.id+"-"+n;$("lc").textContent=(120+n*7+(S.likes[k]?1:0));$("like").firstChild.textContent=S.likes[k]?"❤️":"🤍";
 $("save").firstChild.textContent=S.list.indexOf(P.d.id)>-1?"📌":"🔖";
 $("ln").textContent=P.d.l[0];
 var ok=isOpen(P.d,n);$("lockp").classList.toggle("show",!ok);
 if(!ok)$("lt").textContent="Episode "+n+" terkunci";
 clearInterval(P.h);if(ok)P.h=setInterval(tick,100);
}
function tick(){
 if(P.pause)return;P.p+=0.9;$("fill").style.width=P.p+"%";
 var li=Math.min(2,Math.floor(P.p/34));if(li!=P.li){P.li=li;$("ln").textContent=P.d.l[li]}
 if(P.p>=100){if(P.n<P.d.e)play(P.d.id,P.n+1);else{clearInterval(P.h);tt("Sampai di episode terakhir")}}
}
function stepEp(dx){var n=P.n+dx;if(n<1||n>P.d.e){tt(n<1?"Ini episode pertama":"Ini episode terakhir");return}play(P.d.id,n)}
document.addEventListener("click",function(e){
 var t=e.target.closest("button,.pause,.scene");if(!t)return;
 if(t.dataset.t){S.tab=t.dataset.t;document.querySelectorAll("nav button").forEach(function(b){b.classList.toggle("on",b==t)});render();return}
 if(t.dataset.g){S.g=t.dataset.g;render();return}
 if(t.id=="coinb"){tt("Kamu punya "+S.coins+" koin");return}
 if(t.dataset.p){var a=t.dataset.p.split("-");play(+a[0],+a[1]);return}
 if(t.dataset.s){var i=+t.dataset.s,x=S.list.indexOf(i);if(x>-1)S.list.splice(x,1);else S.list.push(i);sv();openDetail(i);tt(x>-1?"Dihapus dari Daftarku":"Disimpan ke Daftarku");return}
 if(t.dataset.d){openDetail(+t.dataset.d);return}
 if(t.id=="bk"){$("detail").classList.remove("show");render();return}
 if(t.id=="close"){clearInterval(P.h);$("player").classList.remove("show");render();return}
 if(t.id=="prev"){stepEp(-1);return}
 if(t.id=="next"){stepEp(1);return}
 if(t.id=="like"){var k=P.d.id+"-"+P.n;S.likes[k]=!S.likes[k];sv();play(P.d.id,P.n);return}
 if(t.id=="save"){var id=P.d.id,y=S.list.indexOf(id);if(y>-1)S.list.splice(y,1);else S.list.push(id);sv();$("save").firstChild.textContent=y>-1?"🔖":"📌";tt(y>-1?"Dihapus dari Daftarku":"Disimpan ke Daftarku");return}
 if(t.id=="unlock"){if(S.coins<10){tt("Koin tidak cukup. Klaim koin harian dulu.");return}S.coins-=10;S.ul[P.d.id+"-"+P.n]=1;sv();play(P.d.id,P.n);tt("Episode terbuka");return}
 if(t.id=="claim"){if(S.claimed==new Date().toDateString()){tt("Koin harian sudah diklaim");return}S.coins+=20;S.claimed=new Date().toDateString();sv();tt("+20 koin");return}
 if(t.classList.contains("pause")||t.classList.contains("scene")){P.pause=!P.pause;$("pause").classList.toggle("show",P.pause)}
});
render();
</script>
</body>
</html>
